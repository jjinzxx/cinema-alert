name: 24/7 Cinema Alert Bot

on:
  schedule:
    # Runs every 10 minutes, 24/7 in GitHub Cloud (Computer can be turned off!)
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Cloud & Trigger Cinema Check
        run: |
          echo "Sending 24/7 keep-alive ping and triggering monitoring cycle..."
          curl -s -f --retry 3 https://cinema-alert.onrender.com/api/cron/check || curl -s https://cinema-alert.onrender.com/api/health
